<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FastSecret - Send</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<!-- Temporary code panel -->
		<div id="code-panel" class="info-panel" style="display: none;">
			<div>
				<span style="font-size: 0.85rem; display: block; color: var(--text-secondary);">Your Code:</span>
				<span id="code-output" class="code-display">---</span>
			</div>
			<div class="countdown"><span id="countdown-timer">30</span>s</div>
		</div>

		<a href="index.html" class="back-link">&larr; Back to Home</a>
		<h1>New Secret</h1>
		
		<div class="form-group">
			<label for="domain">Domain / Identifier:</label>
			<input type="text" id="domain" placeholder="Secret Name">
		</div>
		<div class="form-group">
			<label for="secret">Secret Content:</label>
			<textarea id="secret" placeholder="Enter your sensitive data here..."></textarea>
		</div>

		<div class="button-bar">
			<button id="btn-paste" class="btn-secondary">Paste</button>
			<button id="btn-send">Send</button>
			<button id="btn-save" class="btn-secondary">Save</button>
		</div>
	</div>
	<script src="requests.js"></script>
	<script src="send.js"></script>
</body>
</html>
