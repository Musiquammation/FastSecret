<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FastSecret - Settings</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<a href="index.html" class="back-link">&larr; Back to Home</a>
		<h1>Settings</h1>
		<div class="form-group">
			<label for="digits">Code Digits Length:</label>
			<input type="number" id="digits" min="1" max="10">
		</div>
		<div class="form-group">
			<label for="duration">Code Duration (seconds):</label>
			<input type="number" id="duration" min="5" max="3600">
		</div>
		<button id="save-settings" style="width: 100%;">Save Settings</button>
	</div>
	<script src="settings.js"></script>
</body>
</html>
